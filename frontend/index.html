<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#3f51b5" />
<title>PashuMitra | Animal Disease Management</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<link rel="manifest" href="manifest.json" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div id="app"></div>
  <script src="app.js"></script>
  <!-- Real-time web calling: Socket.IO client (vendored, MIT) + the calling UI
       and WebRTC client. Loaded after app.js because call.js reuses its globals
       (state/render/header/bottomNav/t/ft/toast) when they are available. -->
  <script src="vendor/socket.io.min.js"></script>
  <script src="call.js"></script>
  <script>
    // Register Service Worker for PWA offline support
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
