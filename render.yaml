services:
  # Flask API and the existing static frontend. For a split Vercel frontend,
  # Vercel proxies /api/* to this service.
  - type: web
    name: pashu-shield-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    disk:
      name: pashu-shield-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SIH_SECRET_KEY
        generateValue: true
      - key: IVR_WEBHOOK_SECRET
        generateValue: true
      - key: SIH_DB_PATH
        value: /var/data/animal_health.db
      - key: SIH_ML_BACKEND
        sync: false
      - key: IVR_PHONE_NUMBER
        value: "7382210251"
      - key: IVR_PROVIDER_MODE
        value: MOCK
      - key: IVR_PSTN_CONNECTED
        value: "false"
      - key: FLASK_ENV
        value: production
      # ------------------------------------------------ farmer OTP login ---
      # Android SMS Gateway (capcom6) Cloud Server credentials.
      # sync: false keeps the values out of Git — set them in the Render
      # dashboard (or as secret files) before enabling OTP login.
      - key: SMS_GATEWAY_MODE
        value: CLOUD
      - key: SMS_GATEWAY_BASE_URL
        value: https://api.sms-gate.app/3rdparty/v1
      - key: SMS_GATEWAY_USERNAME
        sync: false
      - key: SMS_GATEWAY_PASSWORD
        sync: false
      # Pin the OTP handset. Without it the cloud server picks a device at
      # random from the account (documented multi-device behaviour).
      - key: SMS_GATEWAY_DEVICE_ID
        sync: false
      - key: SMS_GATEWAY_TIMEOUT
        value: "15"
      - key: SMS_GATEWAY_CONNECT_TIMEOUT
        value: "5"
      # OTPs must not sit in the device queue for hours; 5 minutes matches the
      # OTP TTL, and priority 100 bypasses device-side delays/rate limits.
      - key: SMS_GATEWAY_TTL_SECONDS
        value: "300"
      - key: SMS_GATEWAY_PRIORITY
        value: "100"
      # Stable pepper for real Farmer OTP hashing and signup tokens. A per-process
      # pepper can make a genuine SMS OTP fail across Gunicorn workers.
      - key: OTP_PEPPER
        generateValue: true
      # Secret for GET /api/admin/otp-diagnostics (delivery tracing).
      - key: OTP_DIAG_TOKEN
        generateValue: true
      - key: OTP_TTL_SECONDS
        value: "300"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      # Farmer auth is OTP-only (no password fallback); staff keep password login.
      - key: OTP_REGISTRATION_TOKEN_TTL_SECONDS
        value: "900"
      # ---------------------------------------------- prototype demo account
      # Ships OFF. Set DEMO_MODE=true AND DEMO_MODE_ALLOW_PRODUCTION=true in the
      # Render dashboard to show the Demo Account box (fixed OTP) on a prototype
      # deployment; set both back to false before any public production use.
      # The documented credentials are explicit here as well as in .env.example.
      # See DEMO_ACCOUNT.md.
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_MODE_ALLOW_PRODUCTION
        value: "false"
      - key: DEMO_FARMER_MOBILE
        value: "8341564042"
      - key: DEMO_FARMER_OTP
        value: "123456"

      # ------------------------------------------------ real-time web calling
      # The signaling socket runs inside this service (Flask-SocketIO). Socket.IO
      # rooms do not cross Gunicorn workers; the shared SQLite signal log is the
      # cross-worker authority and clients reconcile through REST, so --workers 2
      # is correct today. Raise SIH_GUNICORN_WORKERS only together with instance
      # size, or point SIH_REDIS_URL at Redis to make fan-out immediate.
      # Ring timeout, sweeper and push are safe defaults.
      - key: SIH_WEBCALL_RING_TIMEOUT_SECONDS
        value: "45"
      - key: SIH_WEBCALL_SWEEPER
        value: "true"
      - key: SIH_WEBCALL_PUSH_SYNC
        value: "1"
      - key: SIH_STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      # Browser origins allowed to open the signaling socket (the Vercel portal).
      - key: SIH_ALLOWED_ORIGINS
        value: https://pashu-mitra-smoky.vercel.app
      # Secrets: set in the Render dashboard, never in Git.
      # TURN is required for mobile-carrier/CGNAT peers; the frontend receives
      # only short-lived credentials minted from SIH_TURN_SECRET (coturn REST API).
      - key: SIH_TURN_URLS
        sync: false
      - key: SIH_TURN_SECRET
        sync: false
      - key: SIH_TURN_USERNAME
        sync: false
      - key: SIH_TURN_CREDENTIAL
        sync: false
      # Public HTTPS/WSS URL of this service when the browser connects directly
      # (leave blank when the portal proxies /api and the socket path).
      - key: SIH_PUBLIC_BACKEND_URL
        sync: false
      # Web Push (ringing the vet when the portal tab is in the background).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        sync: false
      # Optional Redis message queue for Socket.IO fan-out across workers.
      - key: SIH_REDIS_URL
        sync: false

  # Existing trained-model API. If this service is already deployed separately,
  # create only the backend service above and point SIH_ML_BACKEND at its URL.
  - type: web
    name: pashu-shield-ml
    runtime: python
    rootDir: ml-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_BASE_URL
        sync: false
