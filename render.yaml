services:
  - type: web
    name: pashu-shield-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    disk:
      name: pashu-shield-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SIH_SECRET_KEY
        generateValue: true
      - key: IVR_WEBHOOK_SECRET
        generateValue: true
      - key: SIH_DB_PATH
        value: /var/data/animal_health.db
      - key: IVR_PHONE_NUMBER
        value: "7382210251"
      - key: IVR_PROVIDER_MODE
        value: MOCK
      - key: IVR_PSTN_CONNECTED
        value: "false"
      - key: SIH_ML_BACKEND
        sync: false

  - type: web
    name: pashu-shield-ml
    runtime: python
    rootDir: ml-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_BASE_URL
        sync: false
